<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Somsri Fashion | The Whare Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#7c5549",
                        secondary: "#8c4b55",
                        outline: "#837470",
                        background: "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "on-surface-variant": "#514441"
                    },
                    fontFamily: {
                        headline: ["Noto Serif", "serif"],
                        body: ["Manrope", "sans-serif"],
                        label: ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>

<script>
    function togglePassword() {
        const input = document.getElementById('password-input');
        const icon = document.getElementById('password-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.setAttribute('data-lucide', 'eye-off');
        } else {
            input.type = 'password';
            icon.setAttribute('data-lucide', 'eye');
        }
        lucide.createIcons();
    }

    function handleLogin(event) {
        event.preventDefault();
        const btn = document.getElementById('login-btn');
        const originalText = btn.innerHTML;
        
        // Mock loading state
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> Authenticating...';
        lucide.createIcons();
        
        setTimeout(() => {
            const email = document.querySelector('input[type="email"]').value;
            if (!email.includes('@')) {
                alert('Please enter a valid Whare email address.');
                btn.disabled = false;
                btn.innerHTML = originalText;
                return;
            }
            window.location.href = 'somsri-home.html';
        }, 1500);
    }
</script>

<body class="bg-background font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col antialiased">
<!-- Hero Background Image -->
<div class="fixed inset-0 z-0 opacity-10">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFfbQxlk5B3CUeUMeSMyV_o3laKYgB_ALH5wksdLIPa_znj3We_lmhNc5LUIIj5QzrIJhQQn-c78Yej1RyOZJLpgFykd4hW1hEJG1qmjlLmUPWDExmhO6oyTrg9lZgKyDw-uFibH7H05CW-tZVZSw0hO3Jmhj--j6szVGdzelsQ4GY4ZFWg8saszCUiDXlD5vmR9H2Jc1F9grNasN9NPgdR-jTSav6WtrhMM-cKCBpVLZaNyjd8SxZfcx3q1ywxxbn1LvK4cr4_SbK" alt="Whare Pattern"/>

<!-- Main Content -->
<main class="relative z-10 flex-grow flex items-center justify-center p-6 md:p-12">
<div class="w-full max-w-md">
<!-- Animated Logo/Header Section -->
<div class="text-center mb-10">
<div class="inline-block mb-2">

</a>

</a>
</div>

<form onsubmit="handleLogin(event)" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] font-label font-black tracking-widest uppercase text-outline ml-1">Email Address</label>
<div class="relative">
<input class="w-full bg-stone-50 border-none focus:ring-2 focus:ring-primary/20 transition-all py-4 px-6 font-body text-sm placeholder:text-stone-300 rounded-2xl shadow-sm" placeholder="whare@somsri.com" type="email" required/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end mb-1">
<label class="block text-[10px] font-label font-black tracking-widest uppercase text-outline ml-1">Password</label>
<button type="button" onclick="alert('Password reset link sent to your email.')" class="text-[10px] font-label font-black tracking-widest uppercase text-secondary hover:underline transition-all">Forgot?</button>
</div>
<div class="relative">
<input id="password-input" class="w-full bg-stone-50 border-none focus:ring-2 focus:ring-primary/20 transition-all py-4 px-6 font-body text-sm placeholder:text-stone-300 rounded-2xl shadow-sm" placeholder="••••••••" type="password" required/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-stone-300 hover:text-primary transition-colors p-2" type="button" onclick="togglePassword()">
<i id="password-icon" data-lucide="eye" class="w-5 h-5 text-stone-300 hover:text-primary transition-colors"></i>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-4">
<button id="login-btn" class="w-full h-16 bg-primary text-white font-label font-black tracking-widest uppercase rounded-full shadow-xl shadow-primary/20 hover:shadow-primary/30 active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">
                            Enter the Whare
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative flex items-center my-10">
<div class="flex-grow border-t border-stone-100"></div>
<span class="flex-shrink mx-4 font-label text-[10px] font-black tracking-widest text-stone-200">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-stone-100"></div>
</div>
<!-- Social Logins -->

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
</svg>
<span class="font-label text-[10px] font-black tracking-widest uppercase text-stone-500">Google</span>
</button>

</svg>
<span class="font-label text-[10px] font-black tracking-widest uppercase text-stone-500">Facebook</span>
</button>
</div>
</div>
<!-- Footer Navigation Links -->
<div class="mt-12 flex flex-col md:flex-row items-center justify-between gap-6 px-4">
<div class="flex items-center gap-10">
<a class="group flex items-center gap-2" href="member-registration.html">
<i data-lucide="user-plus" class="w-4 h-4 text-primary transition-transform group-hover:scale-110"></i>
<span class="font-label text-[10px] font-black tracking-widest uppercase text-stone-400 hover:text-primary transition-colors">Create Account</span>
</a>
<a class="group flex items-center gap-2" href="boutique-onboarding-step1.html">
<i data-lucide="store" class="w-4 h-4 text-primary transition-transform group-hover:rotate-12"></i>
<span class="font-label text-[10px] font-black tracking-widest uppercase text-stone-400 hover:text-primary transition-colors">Whare Partner</span>
</a>
</div>
<p class="font-label text-[9px] tracking-[0.2em] text-stone-300 uppercase font-bold">
                    System v2.4.0 • Rose Gold Engine
                </p>
</div>
</div>
</main>
