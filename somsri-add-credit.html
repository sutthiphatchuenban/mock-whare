        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Noto Serif', serif; }

<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-[#fbf9f8] dark:bg-stone-950 flex justify-between items-center w-full px-6 py-4">
<button class="p-2 -ml-2 transition-colors hover:bg-[#f0eded] dark:hover:bg-stone-800 rounded-full active:scale-95 duration-200" onclick="history.back()">
<i data-lucide="arrow-left" class="w-5 h-5 text-[#7c5549] dark:text-[#E5B0A3]"></i>
</button>
<h1 class="text-xl font-bold tracking-tight text-[#7c5549] dark:text-[#E5B0A3]">Top-up Credits</h1>
<a class="p-2 -mr-2 transition-colors hover:bg-[#f0eded] dark:hover:bg-stone-800 rounded-full active:scale-95 duration-200" href="boutique-notifications.html">
<i data-lucide="bell" class="w-5 h-5 text-[#7c5549] dark:text-[#E5B0A3]"></i>
</a>
</header>
<main class="max-w-md mx-auto px-6 pt-6">
<!-- Balance Card: Purple-to-indigo gradient -->
<section class="mb-10">
<div class="relative overflow-hidden rounded-3xl p-8 bg-gradient-to-br from-[#6b4fa3] via-[#4a4e91] to-[#3b3d71] text-white shadow-xl aspect-[1.8/1] flex flex-col justify-between">
<!-- Abstract silk texture overlay -->
<div class="absolute inset-0 opacity-20 pointer-events-none mix-blend-overlay">
<div class="absolute -right-10 -top-10 w-40 h-40 bg-white rounded-full blur-3xl"></div>
<div class="absolute -left-10 -bottom-10 w-40 h-40 bg-purple-400 rounded-full blur-3xl"></div>
</div>
<div class="relative z-10">
<p class="text-white/70 text-xs font-medium tracking-widest uppercase mb-1">Current Balance</p>
<div class="flex items-baseline gap-2">
<span class="text-4xl font-headline font-bold">฿850</span>
<span class="text-white/60 text-sm italic">Somsri Wallet</span>
</div>
</div>
<div class="relative z-10 flex items-center gap-2 bg-white/10 backdrop-blur-md w-fit px-3 py-1.5 rounded-full border border-white/10">
<i data-lucide="badge-check" class="w-4 h-4"></i>
<p class="text-xs font-medium">Instant Payment Ready</p>
</div>
</div>
</section>
<!-- Promotion Banner -->
<section class="mb-8">
<div class="bg-sky-50 dark:bg-sky-950/30 rounded-2xl p-4 flex items-center gap-4 border border-sky-100/50 dark:border-sky-900/30">
<div class="bg-sky-100 dark:bg-sky-900/50 p-2.5 rounded-xl">
<i data-lucide="gift" class="w-6 h-6 text-sky-600 dark:text-sky-400 fill-current"></i>
</div>
<div>
<h4 class="text-sm font-bold text-sky-900 dark:text-sky-200">Exclusive Reward</h4>
<p class="text-xs text-sky-700 dark:text-sky-400">Top up ฿1,000 get free ฿50 credit instantly</p>
</div>
</div>
</section>
<!-- Amount Selection Grid -->
<section class="mb-12">
<div class="flex justify-between items-end mb-4 px-1">
<h3 class="text-lg font-headline font-bold text-on-surface">Select Amount</h3>
<span class="text-xs text-stone-400 font-medium tracking-wide uppercase">Thai Baht (THB)</span>
</div>
<div class="grid grid-cols-3 gap-3" id="amount-selector">
<!-- Option 500 -->
<button class="amount-btn bg-surface-container-lowest border border-stone-100 py-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 hover:border-primary-container" onclick="selectAmount(this, 500)">
<span class="text-stone-400 text-[10px] font-bold uppercase tracking-tighter mb-1">Basic</span>
<span class="text-lg font-bold text-on-surface-variant">฿500</span>
</button>
<!-- Option 1,000 Selected -->
<button class="amount-btn relative bg-primary/5 border-2 border-primary py-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95" onclick="selectAmount(this, 1000)">
<div class="absolute -top-2 bg-primary text-white text-[9px] px-2 py-0.5 rounded-full uppercase font-black tracking-widest shadow-sm">Popular</div>
<span class="text-primary/60 text-[10px] font-bold uppercase tracking-tighter mb-1">Elite</span>
<span class="text-lg font-bold text-primary">฿1,000</span>
</button>
<!-- Option 2,000 -->
<button class="amount-btn bg-surface-container-lowest border border-stone-100 py-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 hover:border-primary-container" onclick="selectAmount(this, 2000)">
<span class="text-stone-400 text-[10px] font-bold uppercase tracking-tighter mb-1">Deluxe</span>
<span class="text-lg font-bold text-on-surface-variant">฿2,000</span>
</button>
<!-- Option 3,000 -->
<button class="amount-btn bg-surface-container-lowest border border-stone-100 py-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 hover:border-primary-container" onclick="selectAmount(this, 3000)">
<span class="text-stone-400 text-[10px] font-bold uppercase tracking-tighter mb-1">Premium</span>
<span class="text-lg font-bold text-on-surface-variant">฿3,000</span>
</button>
<!-- Option 5,000 -->
<button class="amount-btn bg-surface-container-lowest border border-stone-100 py-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 hover:border-primary-container" onclick="selectAmount(this, 5000)">
<span class="text-stone-400 text-[10px] font-bold uppercase tracking-tighter mb-1">Luxe</span>
<span class="text-lg font-bold text-on-surface-variant">฿5,000</span>
</button>
<!-- Others -->
<button class="amount-btn bg-surface-container-lowest border border-stone-100 py-6 rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 hover:border-primary-container group" onclick="handleOtherAmount()">
<i data-lucide="edit-3" class="w-6 h-6 text-stone-400 mb-1 transition-transform group-hover:scale-110"></i>
<span class="text-sm font-bold text-stone-500">Others</span>
</button>
</div>
</section>
<!-- Aesthetic Lookbook Insight (Asymmetric) -->
<section class="mb-12 relative overflow-hidden h-48 rounded-3xl">
<img alt="High fashion model in elegant neutral tones" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBesyxNkdb4g5_emFTah79PeW7UMmZKx6p04H9hi-PtqUI9oAe7XA0He74Zt6X61xTKaEdotztWdk120feaRU7atNvjSpmcHbmq3XoJlkiefMyJsigdZJ6uIxrC7pAGImXD9OQkx6mZUErKJplX_tIj5EoD3ffW_VdBIxf3U_rXr6E0_rEhwQq-e2G_ojwXeLLmhcsYZRhgFCAhX68Jp0zsPDs0J2ChaK0gYhN5xphFmAXdwlPsVU2WTX2kEoiI16QTzlNKpXg9LmXx"/>
<div class="absolute inset-0 bg-gradient-to-r from-[#7c5549]/60 to-transparent flex items-center p-8">
<div class="max-w-[60%]">
<h3 class="text-white text-xl font-headline italic leading-tight">Elevate your closet with one click.</h3>
<p class="text-white/80 text-[10px] font-medium tracking-[0.2em] uppercase mt-2">Member Privilege</p>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-24 left-0 right-0 px-6 z-40">
<button class="w-full bg-primary hover:bg-[#8c4b55] text-white py-5 rounded-full font-bold shadow-2xl shadow-primary/30 flex items-center justify-center gap-3 transition-transform active:scale-95" id="pay-btn" onclick="processPayment()">
<i data-lucide="wallet" class="w-5 h-5"></i>
<span id="pay-text">ชำระเงิน ฿1,000</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 rounded-t-[2rem] bg-white/80 dark:bg-stone-900/80 backdrop-blur-xl border-t border-[#7c5549]/10 shadow-[0_-10px_40px_rgba(124,85,73,0.08)] flex justify-around items-center px-4 pb-6 pt-3">
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-[#8c4b55] transition-colors active:translate-y-0.5 duration-150" href="somsri-home.html">
<i data-lucide="home" class="w-5 h-5"></i>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-[#8c4b55] transition-colors active:translate-y-0.5 duration-150" href="somsri-categories.html">
<i data-lucide="layout-grid" class="w-5 h-5"></i>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Category</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-[#8c4b55] transition-colors active:translate-y-0.5 duration-150" href="somsri-cart.html">
<i data-lucide="shopping-bag" class="w-5 h-5"></i>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Cart</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-[#8c4b55] transition-colors active:translate-y-0.5 duration-150" href="somsri-my-rentals.html">
<i data-lucide="refresh-cw" class="w-5 h-5"></i>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Rentals</span>
</a>
<a class="flex flex-col items-center justify-center text-[#7c5549] dark:text-[#E5B0A3] bg-[#ffffff]/50 dark:bg-stone-800/50 rounded-xl px-3 py-1 scale-105 transition-all" href="somsri-profile.html">
<i data-lucide="user" class="w-5 h-5 fill-current"></i>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Profile</span>
</a>
</nav>
<script>
    let selectedAmount = 1000;

    function selectAmount(btn, amount) {
        document.querySelectorAll('.amount-btn').forEach(b => {
            b.classList.remove('bg-primary/5', 'border-2', 'border-primary');
            b.classList.add('bg-surface-container-lowest', 'border', 'border-stone-100');
            const spanText = b.querySelector('.text-primary');
            if (spanText) {
                spanText.classList.remove('text-primary');
                spanText.classList.add('text-on-surface-variant');
            }
        });

        btn.classList.remove('bg-surface-container-lowest', 'border', 'border-stone-100');
        btn.classList.add('bg-primary/5', 'border-2', 'border-primary');
        const spanText = btn.querySelectorAll('span')[1];
        if (spanText) {
            spanText.classList.remove('text-on-surface-variant');
            spanText.classList.add('text-primary');
        }

        selectedAmount = amount;
        document.getElementById('pay-text').innerText = `ชำระเงิน ฿${amount.toLocaleString()}`;
    }

    function handleOtherAmount() {
        const amount = prompt('กรุณาระบุจำนวนเงินที่ต้องการเติม (ขั้นต่ำ ฿100):', '500');
        if (amount && !isNaN(amount) && parseInt(amount) >= 100) {
            selectedAmount = parseInt(amount);
            document.getElementById('pay-text').innerText = `ชำระเงิน ฿${selectedAmount.toLocaleString()}`;
            alert(`ระบุจำนวนเงิน ฿${selectedAmount.toLocaleString()} สำเร็จ`);
        }
    }

    function processPayment() {
        if (confirm(`ยืนยันการชำระเงินจำนวน ฿${selectedAmount.toLocaleString()}?`)) {
            alert('การชำระเงินเสร็จสมบูรณ์! ขอบคุณที่ใช้บริการ Somsri Fashion');
            window.location.href = 'somsri-profile.html';
        }
    }
    lucide.createIcons();
</script>
</body></html>
</body></html>
