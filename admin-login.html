            background: radial-gradient(circle at top right, #303030 0%, #1b1c1c 100%);

            backdrop-filter: blur(24px);

        }

<body class="bg-stone-auth min-h-screen font-body text-on-surface flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Decorative Red Accents -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-secondary/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px]"></div>
<!-- Header / Top Bar -->
<header class="fixed top-0 left-0 w-full px-8 h-20 flex items-center justify-between z-50">
<a class="flex items-center space-x-3 text-surface-container-lowest hover:opacity-80 transition-opacity" href="index.html">
<i data-lucide="arrow-left" class="w-5 h-5"></i>
<span class="font-label text-xs uppercase tracking-[0.2em]">Back to Hub</span>
</a>
<div class="flex items-center gap-3">
<i data-lucide="shield" class="w-6 h-6 text-secondary"></i>
<h1 class="font-headline text-lg font-semibold tracking-tight text-surface-container-lowest">Whare System Admin</h1>
</div>
<div class="w-24"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[460px] z-10">
<div class="glass-panel p-10 md:p-12 rounded-xl accent-glow flex flex-col">
<div class="mb-10 text-center">
<h2 class="font-headline text-3xl text-surface-container-lowest mb-2">Secure Access</h2>
<p class="font-label text-sm text-surface-dim tracking-wide uppercase">Institutional Management Portal</p>
</div>
<!-- Login Form -->
<form onsubmit="return handleLogin(event)" class="space-y-8">
<!-- Admin Username -->
<div class="space-y-2 group">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-outline-variant opacity-70" for="admin-user">Admin Username</label>
<div class="relative">
<input class="w-full bg-stone-900/50 border-0 border-b border-stone-700/50 text-surface-container-lowest py-3 focus:ring-0 focus:border-secondary transition-all outline-none" id="admin-user" name="username" placeholder="username" type="text" required value="admin"/>
<i data-lucide="user" class="w-5 h-5 absolute right-0 top-1/2 -translate-y-1/2 text-stone-600"></i>
</div>
</div>
<!-- Admin Password -->
<div class="space-y-2 group">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-outline-variant opacity-70" for="admin-pass">Security Password</label>
<div class="relative">
<input class="w-full bg-stone-900/50 border-0 border-b border-stone-700/50 text-surface-container-lowest py-3 focus:ring-0 focus:border-secondary transition-all outline-none" id="admin-pass" name="password" placeholder="••••••••" type="password" required value="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-stone-600 hover:text-secondary transition-colors" type="button" onclick="togglePassword()">
<i data-lucide="eye" id="pass-icon" class="w-5 h-5"></i>
</button>
</div>
</div>
<!-- Remember Me & Reset -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-4 w-4 rounded-sm border-stone-700 bg-stone-900/50 checked:bg-secondary checked:border-secondary focus:ring-offset-stone-900 focus:ring-secondary/20 transition-all appearance-none border" type="checkbox" checked/>
<i data-lucide="check" class="absolute inset-0 text-[12px] text-white opacity-0 peer-checked:opacity-100 flex items-center justify-center font-bold w-4 h-4"></i>
</div>
<span class="text-xs text-stone-400 group-hover:text-surface-dim transition-colors">Remember me</span>
</label>
<a class="text-[10px] font-bold uppercase tracking-widest text-secondary hover:text-secondary-container transition-colors" href="javascript:void(0)" onclick="alert('Recovery link sent to administrator email.')">Recover Keys</a>
</div>
<!-- Login Button -->
<button id="login-btn" class="w-full h-14 bg-gradient-to-r from-secondary to-[#7a3c46] text-white font-label text-xs font-bold uppercase tracking-[0.25em] rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-secondary/10" type="submit">
                    Login as Admin
                </button>
</form>
<!-- Secondary Info -->
<div class="mt-12 flex flex-col items-center gap-4">
<div class="h-[1px] w-12 bg-stone-800"></div>
<div class="flex items-center gap-4 opacity-40">
<img alt="US" class="h-3 grayscale" data-alt="Small US flag icon representing region selection in grayscale aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1zO0orlbyoSKv9MTjfHJ5yfEOaq5UgB-t_02zuoQZQgK5HsgCjUdiiLWoT2X1eDCMstSYkQ0eUc0o15DSvWG4G9m-8WfnvQg8uqs4q6JQQsilb3mptnisjlsfjs98387TQ3J8sVf6iEc06vOz88-G0gEOIGuvnXICeu009Dg6__cuK9q7yD9XX_anQaeOjFiStFwhawkGrBjF7an7oBJxc_GkCiJtuV8Xf_erC3PCryp8pfcYZTPBsj2B6tHJrL9X4ltc8hdXQOYf"/>
<span class="text-[10px] uppercase tracking-widest text-surface-dim">Region: North America</span>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full p-8 flex flex-col md:flex-row items-center justify-between text-stone-600">
<div class="flex items-center gap-2 text-[10px] uppercase tracking-widest">
<span class="w-2 h-2 rounded-full bg-emerald-500/50"></span>
            System Status: Operational
        </div>
<div class="mt-4 md:mt-0 flex items-center gap-6">
<span class="text-[10px] uppercase tracking-[0.2em] font-medium">Version 2.4.0</span>
<span class="h-4 w-[1px] bg-stone-800"></span>
<span class="text-[10px] uppercase tracking-[0.2em] font-bold text-stone-500">Whare System</span>
</div>
</footer>
<!-- Background Decoration Image -->
<div class="absolute inset-0 -z-10 pointer-events-none opacity-20">
<img alt="Tech background" class="w-full h-full object-cover" data-alt="Abstract moody close-up of high-end server hardware with deep red ambient glowing light and sharp metallic textures" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqkxQTHGQna4sUzUo31XhbDldLUkuMnW1lUu-HMik9ydH1GH9a-XJGUi4Hffj4BTg3QbxM5ewrhkkMIWsq24hCOCE2VQkBoBn9GFLv8c0tYDI2dgwqBKJDd1FvR7Rj8tbtCGzupF4gs-fdoD_KZsBR8Nhm_jyHLzKg_CuyL-GcPsHWlkeJRlVochdf2RNHQt0WdbJ34rsmtae34KBd2lkqwS00c0YPbEuUg9kiGjW2TrbvNG3-vXdN92w8dbqU-SYnvyP652PZepOf"/>
</div>
<script>
    function togglePassword() {
        const passInput = document.getElementById('admin-pass');
        const passIcon = document.getElementById('pass-icon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            passIcon.textContent = 'visibility_off';
        } else {
            passInput.type = 'password';
            passIcon.textContent = 'visibility';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        btn.innerHTML = '<span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> Authenticating...';
        btn.disabled = true;
        
        setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
        }, 1200);
        return false;
    }
</script>
<script>
    lucide.createIcons();
</script>
</body></html>
