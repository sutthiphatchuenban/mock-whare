<body class="bg-background text-on-surface font-body min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-white px-6 py-4 flex items-center justify-between border-b border-[#7c5549]/5 shadow-sm">
<a href="somsri-my-rentals.html" class="flex size-10 items-center justify-center rounded-full bg-stone-100 text-[#7c5549] transition-all active:scale-90">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline text-xl font-bold tracking-tight text-primary">Initiate Return</h1>
<div class="size-10"></div>
</header>

<main class="max-w-screen-md mx-auto px-6 pt-10 pb-32">
<!-- Active Item Summary -->
<div class="bg-stone-900 rounded-[2.5rem] p-10 text-white mb-10 shadow-2xl relative overflow-hidden">
<div class="absolute top-0 right-0 p-12 opacity-5">
<span class="material-symbols-outlined text-9xl">autorenew</span>
</div>
<div class="relative z-10 flex items-center gap-8">
<div class="size-24 rounded-2xl overflow-hidden border border-white/10 shrink-0">
<img class="w-full h-full object-cover" src="https://i.pinimg.com/736x/1e/3b/1f/1e3b1f4ea53f23338e2ef61011bafe02.jpg"/>
</div>
<div class="space-y-1">
<p class="text-stone-400 text-[10px] font-black uppercase tracking-widest italic">Item to Return</p>
<h3 class="text-2xl font-headline font-bold italic tracking-tight">Thai Traditional Modern</h3>
<p class="text-xs text-stone-500 font-medium font-label uppercase tracking-widest">ID: #RE-8829</p>
</div>
</div>
</div>

<!-- Return Form -->
<section class="space-y-12">
<div>
<h3 class="font-headline text-xl font-bold italic mb-6 text-stone-300 flex items-center gap-4">
                1. Method of Return
                <span class="h-px flex-grow bg-stone-100"></span>
</h3>
<div class="grid grid-cols-2 gap-4">
<label onclick="methodSelect(this)" class="cursor-pointer bg-white border-2 border-primary p-6 rounded-[2rem] shadow-lg transition-all method-card scale-105">
<div class="size-12 rounded-2xl bg-primary text-white flex items-center justify-center mb-4">
<span class="material-symbols-outlined">local_shipping</span>
</div>
<p class="font-bold text-on-surface">Flash Express</p>
<p class="text-[9px] font-black uppercase tracking-widest text-stone-400 mt-1">Pick-up At Home</p>
</label>
<label onclick="methodSelect(this)" class="cursor-pointer bg-stone-50 border-2 border-transparent p-6 rounded-[2rem] transition-all method-card">
<div class="size-12 rounded-2xl bg-white text-primary flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined">storefront</span>
</div>
<p class="font-bold text-on-surface">Whare Drop-off</p>
<p class="text-[9px] font-black uppercase tracking-widest text-stone-400 mt-1">Visit Boutique</p>
</label>
</div>
</div>

<div>
<h3 class="font-headline text-xl font-bold italic mb-6 text-stone-300 flex items-center gap-4">
                2. Condition Report
                <span class="h-px flex-grow bg-stone-100"></span>
</h3>
<div class="space-y-4">
<button onclick="simulateUpload()" class="w-full aspect-video border-2 border-dashed border-stone-200 rounded-[2rem] flex flex-col items-center justify-center gap-3 hover:bg-stone-50 hover:border-primary/20 transition-all group" id="upload-btn">
<span class="material-symbols-outlined text-4xl text-stone-300 group-hover:text-primary transition-colors">add_a_photo</span>
<span class="text-[10px] font-black uppercase tracking-widest text-stone-300">Upload Inspection Photo</span>
</button>
<textarea class="w-full bg-white border border-stone-100 rounded-[2rem] p-6 font-body text-sm placeholder:text-stone-300 focus:ring-2 focus:ring-primary/10 transition-all outline-none" rows="4" placeholder="Optional: Describe any wear or concerns..."></textarea>
</div>
</div>

<div class="bg-primary/5 p-8 rounded-[2.5rem] border border-primary/10 mb-10">
<div class="flex justify-between items-center mb-2">
<span class="text-stone-500 font-bold text-sm italic">Estimated Refund</span>
<span class="text-2xl font-headline font-black text-primary italic">฿1,500.00</span>
</div>
<p class="text-[9px] font-black uppercase tracking-widest text-stone-400">Refund will be processed to Whare Credits within 24h</p>
</div>

<button onclick="confirmReturn(this)" class="w-full bg-stone-900 text-white py-6 rounded-full font-label text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-4 hover:bg-black transition-all shadow-xl active:scale-95 group">
<span>Finalize Return Manifest</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</section>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 rounded-t-[2.5rem] bg-white text-[#7c5549] backdrop-blur-xl border-t border-[#7c5549]/10 shadow-[0_-10px_40px_rgba(124,85,73,0.08)] flex justify-around items-center px-4 pb-8 pt-4">

<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Home</span>
</a>

<span class="material-symbols-outlined">category</span>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Category</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-400 hover:text-[#8c4b55] transition-colors active:translate-y-0.5 duration-150" href="somsri-cart.html">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Cart</span>
</a>
<a class="flex flex-col items-center justify-center text-primary bg-primary/10 rounded-xl px-4 py-1.5 transition-all shadow-sm" href="somsri-my-rentals.html">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">autorenew</span>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Rentals</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-400 hover:text-[#8c4b55] transition-colors active:translate-y-0.5 duration-150" href="somsri-profile.html">
<span class="material-symbols-outlined">person</span>
<span class="font-['Manrope'] text-[10px] items-center justify-center uppercase tracking-widest font-bold mt-1">Profile</span>
</a>
</nav>

<script>
    function methodSelect(el) {
        document.querySelectorAll('.method-card').forEach(c => {
            c.classList.remove('border-primary', 'shadow-lg', 'scale-105', 'bg-white');
            c.classList.add('border-transparent', 'bg-stone-50');
            c.querySelector('div').classList.replace('bg-primary', 'bg-white');
            c.querySelector('div').classList.replace('text-white', 'text-primary');
            c.querySelector('div').classList.add('shadow-sm');
        });
        el.classList.add('border-primary', 'shadow-lg', 'scale-105', 'bg-white');
        el.classList.remove('border-transparent', 'bg-stone-50');
        el.querySelector('div').classList.replace('bg-white', 'bg-primary');
        el.querySelector('div').classList.replace('text-primary', 'text-white');
        el.querySelector('div').classList.remove('shadow-sm');
    }

    function simulateUpload() {
        const btn = document.getElementById('upload-btn');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-4xl text-primary">progress_activity</span><span class="text-[10px] font-black uppercase tracking-widest text-primary">Analyzing...</span>';
        setTimeout(() => {
            btn.innerHTML = '<div class="w-full h-full overflow-hidden rounded-[2rem] relative"><img src="https://i.pinimg.com/736x/1e/3b/1f/1e3b1f4ea53f23338e2ef61011bafe02.jpg" class="w-full h-full object-cover opacity-50"><div class="absolute inset-0 flex items-center justify-center"><span class="material-symbols-outlined text-4xl text-emerald-500">verified</span></div></div>';
        }, 1500);
    }

    function confirmReturn(btn) {
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>';
        btn.disabled = true;
        setTimeout(() => {
            alert('Manifest Authorized. Manifest ID: #ATM-9932-B\nCourier Pickup scheduled for Tomorrow 9:00 AM.');
            window.location.href = 'somsri-my-rentals.html';
        }, 2000);
    }
</script>
</body></html>
