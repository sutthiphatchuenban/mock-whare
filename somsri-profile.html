<script>
    function toggleSwitch(btn, isDark = false) {
        const dot = btn.querySelector('div');
        if (dot.classList.contains('left-7')) {
            dot.classList.replace('left-7', 'left-1');
            btn.classList.replace('bg-emerald-500', 'bg-stone-200');
            if(isDark) document.documentElement.classList.remove('dark');
        } else {
            dot.classList.replace('left-1', 'left-7');
            btn.classList.replace('bg-stone-200', 'bg-emerald-500');
            if(isDark) document.documentElement.classList.add('dark');
        }
    }

    function editProfile() {
        const newName = prompt('Enter your editorial moniker:', document.getElementById('user-name').innerText);
        if(newName) {
            document.getElementById('user-name').innerText = newName;
            alert('Whare Profile Synced Successfully.');
        }
    }
    lucide.createIcons();
</script>
