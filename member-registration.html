</div>

<label class="font-label text-[10px] tracking-widest uppercase text-primary font-bold px-1">First Name</label>
<input class="form-input-minimal h-12 px-4 rounded-t-lg font-body text-on-surface placeholder:text-on-surface-variant/30" placeholder="e.g. Somsri" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label text-[10px] tracking-widest uppercase text-primary font-bold px-1">Last Name</label>

</div>
<div class="flex flex-col gap-2 md:col-span-2">

</div>
<div class="flex flex-col gap-2 md:col-span-2">

<input class="form-input-minimal h-12 px-4 rounded-t-lg font-body text-on-surface placeholder:text-on-surface-variant/30" placeholder="+66 00 000 0000" required="" type="tel"/>
</div>

<input class="form-input-minimal h-12 px-4 rounded-t-lg font-body text-on-surface placeholder:text-on-surface-variant/30" placeholder="••••••••" required="" type="password"/>
</div>

<input class="form-input-minimal h-12 px-4 rounded-t-lg font-body text-on-surface placeholder:text-on-surface-variant/30" placeholder="••••••••" required="" type="password"/>
